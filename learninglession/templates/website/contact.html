<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Django Learning</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e4e4e4;
            min-height: 100vh;
        }

        nav {
            background: rgba(15, 15, 30, 0.95);
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
            justify-content: center;
            align-items: center;
        }

        nav a {
            color: #e4e4e4;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
        }

        nav a:hover {
            background: rgba(74, 144, 226, 0.2);
            color: #4a90e2;
            transform: translateY(-2px);
        }

        nav a.active {
            background: #4a90e2;
            color: #fff;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .page-title {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #4a90e2, #63b3ed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 0.8s ease;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #a0a0a0;
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease;
        }

        .contact-form {
            background: rgba(30, 30, 50, 0.6);
            padding: 3rem;
            border-radius: 15px;
            border: 1px solid rgba(74, 144, 226, 0.2);
            backdrop-filter: blur(10px);
            animation: fadeInUp 1.2s ease;
        }

        .form-group {
            margin-bottom: 2rem;
        }

        label {
            display: block;
            color: #4a90e2;
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 0.8rem;
        }

        input, textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(20, 20, 40, 0.8);
            border: 2px solid rgba(74, 144, 226, 0.3);
            border-radius: 8px;
            color: #e4e4e4;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #4a90e2;
            background: rgba(20, 20, 40, 0.95);
            box-shadow: 0 0 20px rgba(74, 144, 226, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        .submit-btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(74, 144, 226, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(74, 144, 226, 0.4);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .contact-info {
            background: rgba(30, 30, 50, 0.6);
            padding: 2rem;
            border-radius: 15px;
            border: 1px solid rgba(74, 144, 226, 0.2);
            margin-top: 2rem;
            backdrop-filter: blur(10px);
            animation: fadeInUp 1.4s ease;
        }

        .contact-info h3 {
            color: #4a90e2;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            color: #c0c0c0;
            font-size: 1.1rem;
        }

        .info-item span {
            margin-right: 1rem;
            font-size: 1.5rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: rgba(15, 15, 30, 0.95);
            margin-top: 4rem;
            color: #808080;
        }

        input::placeholder, textarea::placeholder {
            color: #666;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/about ">About</a></li>
            <li><a href="/contact " class="active">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="page-title">Get In Touch</h1>
        <p class="subtitle">Have questions? I'd love to hear from you!</p>

        <form class="contact-form" action="#" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="What's this about?" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Tell me more..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Message</button>
        </form>

        <div class="contact-info">
            <h3>Contact Information</h3>
            <div class="info-item">
                <span>📧</span>
                <p>contact@djangolearning.com</p>
            </div>
            <div class="info-item">
                <span>🌐</span>
                <p>www.djangolearning.com</p>
            </div>
            <div class="info-item">
                <span>📍</span>
                <p>Learning Django from anywhere</p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Django Learning Project. All rights reserved.</p>
    </footer>
</body>
</html>
